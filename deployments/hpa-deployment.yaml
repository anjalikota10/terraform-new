apiVersion: apps/v1
kind: Deployment
metadata:
    name: hpa-deployment
    namespace: dev
spec:
   replicas: 2
   selector:
     matchLabels:
        app: nginx
   template:
      metadata:
         labels:
           app: nginx
      spec:
         containers:
         - name: nginx
           image: nginx:latest
           resources:
              requests:
                 cpu: "100m"
              limits:
                 cpu: "200m"
           ports:
             - containerPort: 80
