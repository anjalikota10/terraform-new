apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
   name: nginx-hpa
   namespace: dev
spec:
  scaleTargetRef:
    apiVersion: v1
    kind: Deployment
    name: hpa-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
   - type: Resource
     resource:
       name: cpu
       target:
         type: Utilization
         averageUtilization: 70
